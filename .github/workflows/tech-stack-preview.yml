name: Generate technology adoption preview

on:
  push:
    branches:
      - tech-stack-preview
    paths:
      - scripts/generate-tech-stack.mjs
      - .github/workflows/tech-stack-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tech-stack-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check private repository token
        id: token
        env:
          GH_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        shell: bash
        run: |
          if [ -n "$GH_STATS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "PROFILE_STATS_TOKEN is not configured."
          fi

      - name: Generate technology adoption cards
        if: steps.token.outputs.available == 'true'
        env:
          GH_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: node scripts/generate-tech-stack.mjs

      - name: Publish changed cards
        if: steps.token.outputs.available == 'true'
        run: |
          git add profile/tech-stack-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update technology adoption preview"
          git pull --rebase origin tech-stack-preview
          git push origin HEAD:tech-stack-preview
